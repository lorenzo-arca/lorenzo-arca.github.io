bio: |
  I am a 6th-year PhD candidate in Economics at the University of Zurich
  and a PhD intern at the Swiss National Bank. My research combines
  structural trade models, quantitative spatial analysis, and
  reduced-form causal estimation to study how firms' offshoring,
  sourcing, and location decisions interact with
  imperfectly competitive labor markets — and the consequences for
  workers, regions, and the environment.

